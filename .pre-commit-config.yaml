
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: python
        additional_dependencies:
          - "ruff>=0.8,<1"
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: python
        additional_dependencies:
          - "ruff>=0.8,<1"
        types: [python]
